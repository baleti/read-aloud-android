plugins {
    id 'com.android.application' version '8.5.0'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

// Auto-generates the SAME debug.keystore build.sh used to (identical
// keytool invocation) if a clean checkout doesn't have one yet - it's
// gitignored, same as every sibling app's.
tasks.register('ensureDebugKeystore') {
    def keystoreFile = file('debug.keystore')
    outputs.file(keystoreFile)
    doLast {
        if (!keystoreFile.exists()) {
            exec {
                commandLine 'keytool', '-genkeypair', '-v',
                    '-keystore', keystoreFile.absolutePath,
                    '-storepass', 'android', '-keypass', 'android',
                    '-alias', 'androiddebugkey',
                    '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000',
                    '-dname', 'CN=Read Aloud Debug,O=local,C=US'
            }
        }
    }
}
tasks.matching { it.name.startsWith('validateSigning') || it.name.startsWith('package') }.configureEach {
    dependsOn 'ensureDebugKeystore'
}

android {
    namespace 'dev.local.readaloud'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.local.readaloud'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Preserves the existing flat layout (AndroidManifest.xml/src/res at
    // the repo root) rather than moving everything under the standard
    // app/src/main/ - keeps git history/paths from before Gradle intact.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            kotlin.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with the same debug key rather than left unsigned -
            // this is a personal tool sideloaded via adb, not something
            // going through Play Store's own signing, matching every
            // sibling app's own debug-keystore-only convention.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The whole reason Gradle exists in this project at all (2026-09-13)
    // - see docs/design.md's Reddit section. Confirmed via TalkBack's own
    // open-source code that this is the exact library it uses for OCR-
    // captioning unlabelled views; Gradle resolves its real transitive
    // graph (play-services-base/basement/tasks, Firebase components/
    // encoders/datatransport, androidx.appcompat, com.google.mlkit:common/
    // vision-common/vision-interfaces - 15-25+ AARs) automatically, which
    // is precisely the part that made hand-integrating it into the old
    // aapt2/kotlinc/d8 pipeline (build.sh) unsafe to attempt.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
}
